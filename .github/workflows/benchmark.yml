name: benchmark

# Runs the voice prompt bank against one or more tools on a GitHub-hosted
# runner (which has open egress), commits the recorded audio + timings under
# data/runs/, and then rebuilds and deploys the site.
#
# Vendor keys are repository secrets (Settings -> Secrets and variables ->
# Actions). Names must match the adapter's env var in scripts/run-voice.mjs:
#   INWORLD_API_KEY, OPENAI_API_KEY, ELEVENLABS_API_KEY, CARTESIA_API_KEY
# A tool whose secret is missing is skipped with a note, never failed.
# OPENAI_API_KEY also powers scoring (Whisper transcripts + judge); without it
# runs are recorded but stay unscored.

on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'Comma-separated tool slugs (default: every tool with an adapter)'
        required: false
        default: 'inworld-tts,openai-tts,elevenlabs,cartesia'
      limit:
        description: 'Only the first N prompts (smoke test). Empty = full bank.'
        required: false
        default: ''
      force:
        description: 'Re-run prompts that already succeeded'
        type: boolean
        default: false
      inworld_key_override:
        description: 'One-off INWORLD_API_KEY for this run only (prefer the repository secret; rotate the key afterwards)'
        required: false
        default: ''
  # Push-triggered requests: commit .github/benchmark-request.json with
  # {"tools": "inworld-tts", "limit": "3", "force": false} to start a run from
  # a session that cannot call the dispatch API.
  push:
    paths: ['.github/benchmark-request.json']
  schedule:
    - cron: '17 5 * * 1'   # weekly, Monday 05:17 UTC

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Resolve request
        id: req
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f .github/benchmark-request.json ]; then
            echo "tools=$(jq -r '.tools // "inworld-tts,openai-tts,elevenlabs,cartesia"' .github/benchmark-request.json)" >> "$GITHUB_OUTPUT"
            echo "limit=$(jq -r '.limit // ""' .github/benchmark-request.json)" >> "$GITHUB_OUTPUT"
            echo "force=$(jq -r '.force // false' .github/benchmark-request.json)" >> "$GITHUB_OUTPUT"
          else
            echo "tools=${{ github.event.inputs.tools || 'inworld-tts,openai-tts,elevenlabs,cartesia' }}" >> "$GITHUB_OUTPUT"
            echo "limit=${{ github.event.inputs.limit }}" >> "$GITHUB_OUTPUT"
            echo "force=${{ github.event.inputs.force || 'false' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Mask one-off inputs
        if: github.event.inputs.inworld_key_override != ''
        run: echo "::add-mask::${{ github.event.inputs.inworld_key_override }}"

      - name: Run tools
        env:
          INWORLD_API_KEY: ${{ github.event.inputs.inworld_key_override || secrets.INWORLD_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          TOOLS: ${{ steps.req.outputs.tools }}
          LIMIT: ${{ steps.req.outputs.limit }}
          FORCE: ${{ steps.req.outputs.force }}
        run: |
          set -u
          status=0
          IFS=',' read -ra TOOL_LIST <<< "$TOOLS"
          for tool in "${TOOL_LIST[@]}"; do
            tool="$(echo "$tool" | xargs)"
            args=(--tool "$tool")
            [ -n "${LIMIT:-}" ] && args+=(--limit "$LIMIT")
            [ "${FORCE:-false}" = "true" ] && args+=(--force)
            echo "::group::$tool"
            if node scripts/run-voice.mjs "${args[@]}"; then
              echo "$tool: ok"
            else
              rc=$?
              if [ "$rc" -eq 3 ]; then echo "$tool: skipped (no key configured)"; else echo "::warning::$tool exited $rc"; status=1; fi
            fi
            echo "::endgroup::"
          done
          exit 0   # partial failures are recorded in runs.json and published; the job stays green so the site still deploys

      - name: Score runs
        if: env.OPENAI_API_KEY != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOOLS: ${{ steps.req.outputs.tools }}
        run: |
          IFS=',' read -ra TOOL_LIST <<< "$TOOLS"
          for tool in "${TOOL_LIST[@]}"; do
            tool="$(echo "$tool" | xargs)"
            [ -f "data/runs/voice/$tool/runs.json" ] || continue
            echo "::group::score $tool"
            node scripts/score-voice.mjs --tool "$tool" --asr openai --judge openai || echo "::warning::scoring $tool had failures"
            echo "::endgroup::"
          done

      - name: Commit recorded runs
        id: commit
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add data/runs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no new runs"
          else
            git commit -m "Record benchmark runs ($(date -u +%Y-%m-%d))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: run
    if: needs.run.outputs.changed == 'true'
    uses: ./.github/workflows/site.yml
